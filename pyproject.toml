requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "standardwebhooks>=1.1.0",
    "tzdata>=2026.6 ; sys_platform == 'win32'",
    "uvicorn>=0.54.0",
]
